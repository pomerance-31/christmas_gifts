<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Christmas</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#b3202a;--green:#1f6b3a;--cream:#fff8ec;--gold:#e6b422;--dark:#12382a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--dark);
  background:linear-gradient(#0f3d2b,#165a3c 60%,#0f3d2b);background-attachment:fixed}
h1,h2,h3{font-family:'Mountains of Christmas',Georgia,serif;margin:0}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.flake{position:absolute;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(40px)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--cream);border-radius:16px;padding:20px;box-shadow:0 6px 18px rgba(0,0,0,.3);border:3px solid var(--gold)}
.stripe{height:10px;border-radius:5px;margin:14px 0;
  background:repeating-linear-gradient(45deg,var(--red) 0 12px,#fff 12px 24px)}
button{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:hover{background:#d02a36}
button.ghost{background:transparent;color:#fff;border:2px solid #fff}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:2px solid #cdb98a;border-radius:10px;background:#fff}
label{font-weight:700;font-size:.9rem;display:block;margin-bottom:4px}
.hidden{display:none !important}

/* login and setup screens */
.screen{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;z-index:1;padding:16px}
.screen .card{max-width:400px;width:100%;text-align:center}
.screen h1{font-size:2.6rem;color:var(--red)}
.tree{font-size:3rem}
.row{text-align:left;margin:14px 0}
.msg{color:var(--red);font-weight:700;min-height:1.3em;margin-bottom:8px}
.demo{font-size:.8rem;opacity:.7;margin-top:12px}
.screen a{color:var(--red);font-size:.9rem}
#icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#icons button{background:#fff;border:3px solid #e6d9b8;border-radius:12px;font-size:1.6rem;padding:6px 0;line-height:1}
#icons button:hover{background:#fff3d6}
#icons button.sel{border-color:var(--red);background:#ffe9e9}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px;flex-wrap:wrap}
.top h1{font-size:2.2rem}

/* add form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.hint{background:#eef6ee;border:2px dashed var(--green);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hint ul{margin:6px 0 0;padding-left:20px}
.hint .dupe{color:var(--red);font-weight:700}

/* lists */
.section-title{color:#fff;font-size:1.7rem;margin:28px 0 10px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.person h3{color:var(--green);font-size:1.5rem;border-bottom:3px solid var(--red);padding-bottom:4px;margin-bottom:10px}
.gift{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #e6d9b8}
.gift:last-child{border:0}
.gift input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--green);flex:none}
.gift .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.gift .name{font-weight:700}
.gift.done .name{text-decoration:line-through;opacity:.5}
.gift a{color:var(--red);font-size:.9rem}
.gift .notes{font-size:.88rem;opacity:.8}
.gift .by{font-size:.8rem;color:var(--green);font-weight:700}
.gift .posted{font-size:.8rem;color:#7a6a45;font-style:italic}
.gift .x{background:transparent;color:#999;padding:0 6px;font-size:1rem;align-self:flex-start}
.gift .x:hover{background:transparent;color:var(--red)}
.empty{opacity:.6;font-style:italic}
button:disabled{opacity:.6;cursor:default}
.quick{background:#fffbe9;border:2px dashed var(--gold);border-radius:12px;padding:12px}
.quickrow{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
#fillmsg{font-size:.9rem;font-weight:700}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;font-weight:700;color:var(--green)}
.or::before,.or::after{content:'';flex:1;height:8px;border-radius:4px;background:repeating-linear-gradient(45deg,var(--red) 0 10px,#fff 10px 20px)}
@keyframes glow{0%{box-shadow:0 0 0 5px rgba(230,180,34,.95)}100%{box-shadow:0 0 0 0 rgba(230,180,34,0)}}
.glow{animation:glow 2.2s ease-out}
.social{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{background:#fff;color:var(--dark);border:2px solid #e6d9b8;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700}
.chip:hover{background:#fff3d6}
.chip.on{background:#ffe9e9;border-color:var(--red);color:var(--red)}
.thread{margin-top:8px;padding:8px;background:#fffbe9;border-radius:10px;border:1px solid #e6d9b8}
.cm{font-size:.88rem;padding:3px 0}
.cm .when{font-size:.75rem;opacity:.6;margin-left:4px}
.cx{background:transparent;color:#999;padding:0 4px;font-size:.85rem}
.chip.mini{padding:0 8px;font-size:.75rem;margin-left:6px}
.cx:hover{background:transparent;color:var(--red)}
.cmform{display:flex;gap:6px;margin-top:6px}
.cmform input{padding:6px 8px;font-size:.88rem;flex:1;min-width:0}
.cmform button{padding:6px 12px;font-size:.88rem;flex:none;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{background:#fff;color:var(--dark);border:2px solid var(--gold);border-radius:999px;padding:6px 14px;font-size:.95rem}
.tab:hover{background:#fff3d6}
.tab.on{background:var(--red);color:#fff;border-color:#fff}
.tab small{opacity:.7;font-weight:700;margin-left:2px}
.addtoggle{width:100%;text-align:left;background:transparent;color:var(--red);font-family:'Mountains of Christmas',Georgia,serif;font-size:1.5rem;padding:0}
.addtoggle:hover{background:transparent}
#addbody{margin-top:12px}
.people.single{grid-template-columns:1fr}
.edit input,.edit textarea{margin-bottom:6px}
.editbtns button{padding:6px 14px}
.editbtns button.ghost{color:var(--dark);border-color:#cdb98a}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>

<!-- SIGN IN -->
<div class="screen" id="loginScreen">
  <div class="card">
    <div class="tree">🎄</div>
    <h1>Family Christmas</h1>
    <div class="stripe"></div>
    <p>Helping keep track of gift ideas for the fam</p>
    <div class="row"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="row"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="msg" id="loginMsg"></div>
    <button id="signin">Enter ❄️</button>
    <div style="margin-top:12px"><a href="#" id="forgot">Forgot password?</a></div>
    <div class="demo">First time here? Use the invite link in your email.</div>
  </div>
</div>

<!-- FIRST LOGIN SETUP (also used for password resets) -->
<div class="screen hidden" id="setupScreen">
  <div class="card">
    <div class="tree">🎅</div>
    <h1 id="setupTitle"></h1>
    <div class="stripe"></div>
    <p id="setupIntro"></p>
    <div class="row"><label for="npw">Password</label><input id="npw" type="password" autocomplete="new-password"></div>
    <div class="row"><label for="npw2">Confirm password</label><input id="npw2" type="password" autocomplete="new-password"></div>
    <div class="row" id="iconRow"><label>Pick your icon</label><div id="icons"></div></div>
    <div class="msg" id="setupMsg"></div>
    <button id="savesetup">Save and enter ❄️</button>
  </div>
</div>

<!-- APP -->
<div class="wrap hidden" id="app">
  <div class="top">
    <h1><span id="myicon">🎅</span> <span id="hi"></span>'s Gift Ideas</h1>
    <button class="ghost" id="logout">Log out</button>
  </div>
  <div class="stripe"></div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <button type="button" class="addtoggle" id="toggleAdd" aria-expanded="false">🎁 Add a gift idea ▸</button>
    <div id="addbody" class="hidden">
    <div class="quick">
      <label for="quick">✨ Quick add: type it in your own words</label>
      <textarea id="quick" rows="2" maxlength="1000"></textarea>
      <div class="quickrow">
        <button type="button" id="fill">Fill it in ✨</button>
        <span id="fillmsg" style="color:var(--green)">Say who it is for, and add a link if you have one.</span>
      </div>
    </div>
    <div class="or">or fill it in yourself</div>
    <form id="form" class="grid2">
      <div><label for="for">Who is it for?</label><select id="for"></select></div>
      <div><label for="name">Gift</label><input id="name" required maxlength="120" placeholder="e.g., a Rolex"></div>
      <div class="full"><label for="link">Link (optional)</label><input id="link" type="url" placeholder="https://"></div>
      <div class="full"><label for="notes">Notes (optional)</label><textarea id="notes" rows="2" maxlength="1000" placeholder="Size, color, etc."></textarea></div>
      <div class="full hint" id="hint"></div>
      <div class="full"><button type="submit">Add idea ⭐</button></div>
    </form>
    </div>
  </div>

  <h2 class="section-title" id="mineTitle">🎄 My list</h2>
  <div class="card" id="mine"></div>

  <h2 class="section-title" id="othersTitle">🎁 Everyone else</h2>
  <div class="people" id="others"></div>
</div>

<script>
// 1. Paste your two values from Supabase (Project Settings > API)
const SUPABASE_URL = 'https://yjqfxqulfrpkkmekjbcv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Q-vTvlUIKHXKQ37mnlU3Fg_5ZM75CCI';

const ICONS = ['🎅','🤶','🦌','⛄','🎄','⭐','🎁','🔔','🍪','🧦','🧝','🐻‍❄️'];
const LINK_TYPE = (location.hash.match(/type=(\w+)/) || [])[1]; // "invite" or "recovery", read before Supabase clears it

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg = (id, t) => { $(id).textContent = t; };
const show = id => ['loginScreen','setupScreen','app'].forEach(s => $(s).classList.toggle('hidden', s !== id));

// snow
(function(){
  const s = $('snow');
  for(let i=0;i<45;i++){
    const f = document.createElement('div');
    f.className = 'flake';
    f.textContent = Math.random() > .3 ? '❄' : '•';
    f.style.left = Math.random()*100 + 'vw';
    f.style.fontSize = (8 + Math.random()*16) + 'px';
    f.style.animationDuration = (8 + Math.random()*12) + 's';
    f.style.animationDelay = (-Math.random()*15) + 's';
    s.appendChild(f);
  }
})();

if(SUPABASE_URL.startsWith('PASTE')){
  msg('loginMsg', 'Add your Supabase URL and key at the top of the script first.');
  throw new Error('Supabase is not configured yet');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null, profiles = [], gifts = [], buys = [], votes = [], comments = [], commentLikes = [], pick = ICONS[0];
const openThreads = new Set(), drafts = {};
let passwordPending = LINK_TYPE === 'recovery';

const iconOf = p => p.icon || '🎁';
const nameOf = id => (profiles.find(p => p.id === id) || {}).name || '?';
const buyOf = id => buys.find(b => b.gift_id === id);
const visibleFor = pid => gifts.filter(g => g.recipient_id === pid);
const safeLink = u => /^https?:\/\//i.test(u || '');

async function loadData(){
  const [p, g, b, v, c, l] = await Promise.all([
    sb.from('profiles').select('*').order('name'),
    sb.from('gifts').select('*').order('created_at'),
    sb.from('purchases').select('*'),
    sb.from('votes').select('*'),
    sb.from('comments').select('*').order('created_at'),
    sb.from('comment_likes').select('*')
  ]);
  profiles = p.data || []; gifts = g.data || []; buys = b.data || [];
  votes = v.data || []; comments = c.data || []; commentLikes = l.data || [];
}
async function refresh(){ await loadData(); renderHint(); renderLists(); }

// icon picker
$('icons').innerHTML = ICONS.map(i => `<button type="button" data-i="${i}" class="${i === pick ? 'sel' : ''}">${i}</button>`).join('');
$('icons').onclick = e => {
  const b = e.target.closest('button');
  if(!b) return;
  pick = b.dataset.i;
  [...$('icons').children].forEach(x => x.classList.toggle('sel', x === b));
};

// auth
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_OUT' || !session){ me = null; show('loginScreen'); return; }
  setTimeout(() => route(session), 0); // outside the callback so Supabase calls do not deadlock
});

async function route(session){
  const sameUser = me && session.user.email.toLowerCase() === me.email.toLowerCase();
  if(sameUser && !$('app').classList.contains('hidden')){ await refresh(); return; }
  await loadData();
  me = profiles.find(p => p.email.toLowerCase() === session.user.email.toLowerCase());
  if(!me){
    await sb.auth.signOut();
    msg('loginMsg', 'That email is not on the family list.');
    return;
  }
  if(passwordPending || !me.icon) showSetup(); else enterApp();
}

function showSetup(){
  const needIcon = !me.icon;
  show('setupScreen');
  $('iconRow').classList.toggle('hidden', !needIcon);
  $('setupTitle').textContent = needIcon ? `Welcome, ${me.name}!` : 'New password';
  $('setupIntro').textContent = needIcon
    ? 'Create a password and pick your icon to get started. 🎁'
    : 'Choose a new password. 🎁';
}

function enterApp(){
  show('app');
  $('hi').textContent = me.name;
  $('myicon').textContent = iconOf(me);
  $('for').innerHTML = profiles.map(p => `<option value="${p.id}">${p.id === me.id ? 'Myself' : esc(p.name)}</option>`).join('');
  const other = profiles.find(p => p.id !== me.id) || me;
  $('for').value = other.id;
  $('quick').placeholder = 'e.g., a cozy wool scarf for ' + other.name + ', dark green, https://...';
  renderHint(); renderLists();
}

$('signin').onclick = async () => {
  msg('loginMsg', '');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if(error) msg('loginMsg', 'Wrong email or password.');
};
$('pw').onkeydown = e => { if(e.key === 'Enter') $('signin').click(); };

$('forgot').onclick = async e => {
  e.preventDefault();
  const email = $('email').value.trim();
  if(!email){ msg('loginMsg', 'Type your email above first.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  msg('loginMsg', error ? error.message : 'Check your email for a reset link.');
};

$('savesetup').onclick = async () => {
  const pw = $('npw').value;
  if(pw.length < 6){ msg('setupMsg', 'Password needs at least 6 characters.'); return; }
  if(pw !== $('npw2').value){ msg('setupMsg', 'Passwords do not match.'); return; }
  let r = await sb.auth.updateUser({ password: pw });
  if(r.error){ msg('setupMsg', r.error.message); return; }
  if(!me.icon){
    r = await sb.from('profiles').update({ icon: pick }).eq('id', me.id).select();
    if(r.error || !r.data || !r.data.length){ msg('setupMsg', 'Could not save your icon, please try again.'); return; }
    me.icon = pick;
  }
  passwordPending = false;
  $('npw').value = $('npw2').value = '';
  msg('setupMsg', '');
  await loadData();
  me = profiles.find(p => p.id === me.id);
  enterApp();
};

$('logout').onclick = () => sb.auth.signOut();

// duplicate check: shows the list for whoever is selected and flags similar names
function renderHint(){
  const pid = $('for').value;
  const typed = $('name').value.trim().toLowerCase();
  const title = pid === me.id ? 'Already on your list:' : `Already on ${esc(nameOf(pid))}'s list:`;
  const items = visibleFor(pid).map(g => {
    const n = g.name.toLowerCase();
    const similar = typed.length > 2 && (n.includes(typed) || typed.includes(n));
    return `<li class="${similar ? 'dupe' : ''}">${esc(g.name)}${similar ? ' (looks similar!)' : ''}</li>`;
  }).join('');
  $('hint').innerHTML = `<b>${title}</b>` + (items ? `<ul>${items}</ul>` : ' <span class="empty">nothing yet</span>');
}
$('for').onchange = renderHint;
$('name').oninput = renderHint;

// Quick add: turn a casual note into the form fields
const say = (t, bad) => { $('fillmsg').textContent = t; $('fillmsg').style.color = bad ? 'var(--red)' : 'var(--green)'; };
const glow = el => { el.classList.remove('glow'); void el.offsetWidth; el.classList.add('glow'); };

async function quickFill(){
  const text = $('quick').value.trim();
  if(!text){ say('Type your idea first.', true); return; }
  $('fill').disabled = true;
  say('Reading your note...');
  try{
    const { data, error } = await sb.functions.invoke('parse-gift', { body: { text } });
    if(error || !data || data.error){
      let m = (data && data.error) || null;
      if(!m && error && error.context && error.context.json){
        try{ m = (await error.context.json()).error; }catch(_){}
      }
      say(m || 'The helper is unavailable right now. You can fill it in below.', true);
      return;
    }
    const person = profiles.find(p => p.name === data.recipient);
    if(person){ $('for').value = person.id; glow($('for')); }
    [['name', data.gift], ['link', data.link], ['notes', data.notes]].forEach(([id, v]) => {
      $(id).value = v || '';
      if(v) glow($(id));
    });
    renderHint();
    let m = data.problem || 'Check the details below, then click Add idea.';
    if(data.extra_ideas > 0) m += ` I also saw ${data.extra_ideas} more idea${data.extra_ideas > 1 ? 's' : ''}, so add this one first and then type the next.`;
    say(m, !!data.problem);
  }catch(e){
    say('The helper is unavailable right now. You can fill it in below.', true);
  }finally{
    $('fill').disabled = false;
  }
}
$('fill').onclick = quickFill;
$('quick').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); quickFill(); } };

$('form').onsubmit = async e => {
  e.preventDefault();
  const r = await sb.from('gifts').insert({
    recipient_id: $('for').value,
    posted_by: me.id,
    name: $('name').value.trim(),
    link: $('link').value.trim() || null,
    notes: $('notes').value.trim() || null
  });
  if(r.error){ alert(r.error.message); return; }
  $('name').value = $('link').value = $('notes').value = '';
  $('quick').value = '';
  say('');
  await refresh();
};

let editing = null; // id of the idea being edited

function editHTML(g){
  return `<div class="gift"><span>✏️</span><div class="grow edit">
    <input data-e="name" maxlength="120" value="${esc(g.name)}" placeholder="Gift">
    <input data-e="link" type="url" value="${esc(g.link || '')}" placeholder="Link (optional)">
    <textarea data-e="notes" rows="2" maxlength="1000" placeholder="Notes (optional)">${esc(g.notes || '')}</textarea>
    <div class="editbtns"><button type="button" data-save="${g.id}">Save</button> <button type="button" class="ghost" data-cancel="1">Cancel</button></div>
  </div></div>`;
}

function giftHTML(g, shopping){
  if(editing === g.id) return editHTML(g);
  const b = shopping ? buyOf(g.id) : null;
  const locked = b && b.buyer_id !== me.id;
  return `<div class="gift ${b ? 'done' : ''}">
    ${shopping ? `<input type="checkbox" data-id="${g.id}" ${b ? 'checked' : ''} ${locked ? 'disabled' : ''} title="Mark as bought">` : '<span>🎁</span>'}
    <div class="grow">
      <div class="name">${esc(g.name)}</div>
      ${safeLink(g.link) ? `<a href="${esc(g.link)}" target="_blank" rel="noopener">View link</a>` : ''}
      ${g.notes ? `<div class="notes">${esc(g.notes)}</div>` : ''}
      ${shopping ? `<div class="posted">Posted by ${g.posted_by === me.id ? 'you' : esc(nameOf(g.posted_by))}</div>` : ''}
      ${b ? `<div class="by">Bought by ${b.buyer_id === me.id ? 'you' : esc(nameOf(b.buyer_id))}</div>` : ''}
      ${shopping ? socialHTML(g) : ''}
    </div>
    ${g.posted_by === me.id ? `<button class="x" data-edit="${g.id}" title="Edit this idea">✎</button><button class="x" data-del="${g.id}" title="Remove this idea">✕</button>` : ''}
  </div>`;
}

const fmt = d => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

function likeChip(c){
  const ls = commentLikes.filter(l => l.comment_id === c.id);
  const on = ls.some(l => l.liker_id === me.id);
  const who = ls.map(l => l.liker_id === me.id ? 'You' : nameOf(l.liker_id)).join(', ');
  return `<button type="button" class="chip mini ${on ? 'on' : ''}" data-likec="${c.id}" title="${esc(who) || 'Like this comment'}">👍${ls.length ? ' ' + ls.length : ''}</button>`;
}

function socialHTML(g){
  const vs = votes.filter(v => v.gift_id === g.id);
  const mineV = vs.some(v => v.voter_id === me.id);
  const cs = comments.filter(c => c.gift_id === g.id);
  const who = vs.map(v => v.voter_id === me.id ? 'You' : nameOf(v.voter_id)).join(', ');
  let h = `<div class="social">
    <button type="button" class="chip ${mineV ? 'on' : ''}" data-vote="${g.id}" title="${esc(who) || 'Be the first to like this'}">👍 ${vs.length || ''}</button>
    <button type="button" class="chip" data-thread="${g.id}">💬 ${cs.length || 'Comment'}</button>
  </div>`;
  if(openThreads.has(g.id)){
    h += `<div class="thread">` +
      cs.map(c => `<div class="cm"><b>${c.author_id === me.id ? 'You' : esc(nameOf(c.author_id))}</b> ${esc(c.body)}<span class="when">${fmt(c.created_at)}</span> ${likeChip(c)}${c.author_id === me.id ? ` <button type="button" class="cx" data-delc="${c.id}" title="Delete comment">✕</button>` : ''}</div>`).join('') +
      `<div class="cmform"><input data-draft="${g.id}" maxlength="500" placeholder="Add a comment" value="${esc(drafts[g.id] || '')}"><button type="button" data-post="${g.id}">Post</button></div></div>`;
  }
  return h;
}

async function refreshSocial(){
  const [v, c, l] = await Promise.all([
    sb.from('votes').select('*'),
    sb.from('comments').select('*').order('created_at'),
    sb.from('comment_likes').select('*')
  ]);
  votes = v.data || []; comments = c.data || []; commentLikes = l.data || [];
  renderLists();
}

// which list is showing: 'all', or one person's id (including mine)
let view = 'all';
try{ view = localStorage.getItem('giftView') || 'all'; }catch(_){}

function renderTabs(){
  if(view !== 'all' && !profiles.some(p => p.id === view)) view = 'all';
  const one = (id, label, n) => `<button type="button" class="tab ${view === id ? 'on' : ''}" data-view="${id}">${label}${n === null ? '' : ` <small>${n}</small>`}</button>`;
  $('tabs').innerHTML = one('all', '🎄 Everyone', null)
    + one(me.id, '🎅 My list', visibleFor(me.id).length)
    + profiles.filter(p => p.id !== me.id).map(p => one(p.id, `${iconOf(p)} ${esc(p.name)}`, visibleFor(p.id).length)).join('');
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]');
  if(!b) return;
  view = b.dataset.view;
  try{ localStorage.setItem('giftView', view); }catch(_){}
  if(view !== 'all'){ $('for').value = view; renderHint(); }
  renderLists();
});

$('toggleAdd').onclick = () => {
  const open = $('addbody').classList.toggle('hidden') === false;
  $('toggleAdd').setAttribute('aria-expanded', open);
  $('toggleAdd').textContent = open ? '🎁 Add a gift idea ▾' : '🎁 Add a gift idea ▸';
};

function renderLists(){
  renderTabs();
  const showMine = view === 'all' || view === me.id;
  const showOthers = view !== me.id;
  $('mineTitle').classList.toggle('hidden', !showMine);
  $('mine').classList.toggle('hidden', !showMine);
  $('othersTitle').classList.toggle('hidden', view !== 'all');
  $('others').classList.toggle('hidden', !showOthers);
  $('others').classList.toggle('single', view !== 'all');

  const mine = visibleFor(me.id);
  $('mine').innerHTML = mine.length ? mine.map(g => giftHTML(g, false)).join('')
    : '<span class="empty">You have not added any ideas for yourself yet.</span>';

  $('others').innerHTML = profiles.filter(p => p.id !== me.id && (view === 'all' || p.id === view)).map(p => {
    const list = visibleFor(p.id).sort((a, b) => votes.filter(v => v.gift_id === b.id).length - votes.filter(v => v.gift_id === a.id).length);
    return `<div class="card person"><h3>${iconOf(p)} ${esc(p.name)}</h3>` +
      (list.length ? list.map(g => giftHTML(g, true)).join('') : '<span class="empty">No ideas yet. Add one!</span>') +
      '</div>';
  }).join('');
}

// bought checkbox
$('others').addEventListener('change', async e => {
  const cb = e.target.closest('input[data-id]');
  if(!cb) return;
  const id = Number(cb.dataset.id);
  const r = cb.checked
    ? await sb.from('purchases').insert({ gift_id: id, buyer_id: me.id })
    : await sb.from('purchases').delete().eq('gift_id', id);
  if(r.error) alert(r.error.message);
  await refresh();
});

// edit an idea you posted
$('app').addEventListener('click', async e => {
  const b = e.target.closest('button[data-edit], button[data-cancel], button[data-save]');
  if(!b) return;
  if(b.dataset.edit){ editing = Number(b.dataset.edit); renderLists(); return; }
  if(b.dataset.cancel){ editing = null; renderLists(); return; }
  const row = b.closest('.gift');
  const val = k => row.querySelector(`[data-e="${k}"]`).value.trim();
  const name = val('name'), link = val('link');
  if(!name){ alert('The gift needs a name.'); return; }
  if(link && !safeLink(link)){ alert('The link should start with http:// or https://'); return; }
  b.disabled = true;
  const r = await sb.from('gifts').update({ name, link: link || null, notes: val('notes') || null })
    .eq('id', Number(b.dataset.save)).select();
  if(r.error || !r.data || !r.data.length){
    alert(r.error ? r.error.message : 'Could not save that change.');
    b.disabled = false;
    return;
  }
  editing = null;
  await refresh();
});

// remove an idea you posted
$('app').addEventListener('click', async e => {
  const b = e.target.closest('button[data-del]');
  if(!b || !confirm('Remove this idea?')) return;
  const r = await sb.from('gifts').delete().eq('id', Number(b.dataset.del));
  if(r.error) alert(r.error.message);
  await refresh();
});

// votes and comments (the database hides them from the person an idea is for)
$('others').addEventListener('input', e => {
  const d = e.target.dataset && e.target.dataset.draft;
  if(d) drafts[d] = e.target.value;
});
$('others').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.draft){
    e.preventDefault();
    const b = e.target.parentElement.querySelector('[data-post]');
    if(b) b.click();
  }
});
$('others').addEventListener('click', async e => {
  const t = e.target.closest('button');
  if(!t) return;
  if(t.dataset.vote){
    const id = Number(t.dataset.vote);
    const mine = votes.some(v => v.gift_id === id && v.voter_id === me.id);
    t.disabled = true;
    const r = mine
      ? await sb.from('votes').delete().eq('gift_id', id).eq('voter_id', me.id)
      : await sb.from('votes').insert({ gift_id: id, voter_id: me.id });
    if(r.error) alert(r.error.message);
    await refreshSocial();
  }else if(t.dataset.thread){
    const id = Number(t.dataset.thread);
    if(openThreads.has(id)) openThreads.delete(id); else openThreads.add(id);
    renderLists();
    const inp = openThreads.has(id) ? $('others').querySelector(`input[data-draft="${id}"]`) : null;
    if(inp) inp.focus();
  }else if(t.dataset.post){
    const id = Number(t.dataset.post);
    const inp = $('others').querySelector(`input[data-draft="${id}"]`);
    const body = inp ? inp.value.trim() : '';
    if(!body) return;
    t.disabled = true;
    const r = await sb.from('comments').insert({ gift_id: id, author_id: me.id, body });
    if(r.error){ alert(r.error.message); t.disabled = false; return; }
    drafts[id] = '';
    await refreshSocial();
    const again = $('others').querySelector(`input[data-draft="${id}"]`);
    if(again) again.focus();
  }else if(t.dataset.likec){
    const id = Number(t.dataset.likec);
    const mine = commentLikes.some(l => l.comment_id === id && l.liker_id === me.id);
    t.disabled = true;
    const r = mine
      ? await sb.from('comment_likes').delete().eq('comment_id', id).eq('liker_id', me.id)
      : await sb.from('comment_likes').insert({ comment_id: id, liker_id: me.id });
    if(r.error) alert(r.error.message);
    await refreshSocial();
  }else if(t.dataset.delc){
    if(!confirm('Delete this comment?')) return;
    const r = await sb.from('comments').delete().eq('id', Number(t.dataset.delc));
    if(r.error) alert(r.error.message);
    await refreshSocial();
  }
});

// pick up new ideas when someone returns to the tab
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && me && editing === null && !$('app').classList.contains('hidden')) refresh();
});
</script>
</body>
</html>
